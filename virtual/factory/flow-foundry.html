<!doctype html><html lang="ja"><head><script src="../entry-guard.js?v=2"></script><script src="../game-input.js?v=1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07141e"><title>FLOW FOUNDRY｜遊んで育てる未来工場</title><link rel="stylesheet" href="style.css?v=1"></head><body><canvas id="world" aria-label="成長する立体未来工場"></canvas><div class="vignette"></div><header><a href="../">LINK BASE <b>FLOW FOUNDRY</b></a><div><button id="sound">音 OFF</button><button id="pause">一時停止</button></div></header>
<section id="welcome"><div class="intro"><small>COLLECT. BUILD. CHAIN.</small><h1>小さな一撃が、<br><em>巨大な街になる。</em></h1><p>タップで採掘。まとめて回収。一気に建設。<br>触るほど速くなる、未来都市の成長ゲーム。</p><div class="start-buttons"><button id="startSound">音ありでスタート</button><button id="startSilent">音なしでスタート</button></div><p id="welcomeSave" class="fine"></p><p class="fine">セーブはこのブラウザに自動保存。<br>PC：画面クリック／Spaceで回収・1〜3で建設<br>タッチ：工場をタップ。画面をドラッグして街を回転。</p></div></section>
<main id="hud" hidden><section class="score"><small>建設資材</small><strong id="bank">45</strong><span id="production"></span><div class="boost"><span id="combo">連続タップで生産2倍</span><i><b id="boostBar"></b></i></div></section><section class="chapter"><div><span id="district">小さな作業場</span><b id="cityLevel">CITY 01</b></div><div class="progress"><i id="goalBar"></i></div><small id="goal"></small></section><div id="popups" aria-hidden="true"></div><div id="toast" role="status"></div><button id="delivery" hidden>特急便が来た！<b>タップで受け取る</b></button>
<section class="control-dock"><div class="harvest-row"><button id="mine">採掘する <small>連打で連鎖・ブースト</small></button><button id="collect"><small>まとめて回収</small><strong id="stored">0</strong><span id="collectHint">資材へ変換</span></button></div><div class="build-row"><button data-build="mines"><span class="type mine">01</span><div><b>採掘タワー</b><small id="minesInfo"></small></div><strong id="minesCost"></strong></button><button data-build="forges"><span class="type forge">02</span><div><b>精製プラント</b><small id="forgesInfo"></small></div><strong id="forgesCost"></strong></button><button data-build="drones"><span class="type drone">03</span><div><b>ドローン港</b><small id="dronesInfo"></small></div><strong id="dronesCost"></strong></button></div><footer><span id="saveState">自動保存</span><span>工場をタップで採掘／ドラッグで回転</span></footer></section></main>
<section id="pausePanel" hidden><div><small>PAUSED</small><h2>街の続きは、ここから。</h2><p>再開するまで進行と音は止まります。</p><button id="resume">続ける</button><a href="../">ブロックの街へ</a></div></section><div id="error" role="alert"></div><script type="module" src="game.js?v=1"></script></body></html>
