<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINK CORE Bridge</title>
</head>
<body>
<script>
(() => {
  'use strict';

  // 通信を許可するページのオリジン（末尾のスラッシュなし）。公開先を増やしたらここに追加する。
  const ALLOWED_ORIGINS = [
    'https://morigu812-svg.github.io',
    'https://my-links-phdf.onrender.com'   // ← RenderのURLに書き換える
  ];
  const ALLOWED_METHODS = new Set([
    'getAdminSetupStatus',
    'authenticateAdmin',
    'authenticateVisitor',
    'getLinks',
    'saveLink',
    'toggleFavorite',
    'deleteLink',
    'getOfficialLinks',
    'saveOfficialLink',
    'deleteOfficialLink',
    'getMemos',
    'saveMemo',
    'deleteMemo'
  ]);

  function send(target, message, origin) {
    target.postMessage(message, origin);
  }

  window.addEventListener('message', event => {
    if (ALLOWED_ORIGINS.indexOf(event.origin) === -1) return;
    if (event.source !== window.top) return;

    const request = event.data;
    if (!request || request.type !== 'DAILY_CORE_REQUEST') return;

    const { id, method, args } = request;
    if (typeof id !== 'string' || !ALLOWED_METHODS.has(method) || !Array.isArray(args)) {
      send(event.source, {
        type: 'DAILY_CORE_RESPONSE', id, ok: false, error: '不正なリクエストです。'
      }, event.origin);
      return;
    }

    try {
      const runner = google.script.run
        .withSuccessHandler(result => send(event.source, {
          type: 'DAILY_CORE_RESPONSE', id, ok: true, result
        }, event.origin))
        .withFailureHandler(error => send(event.source, {
          type: 'DAILY_CORE_RESPONSE', id, ok: false,
          error: error && error.message ? error.message : String(error)
        }, event.origin));

      runner[method](...args);
    } catch (error) {
      send(event.source, {
        type: 'DAILY_CORE_RESPONSE', id, ok: false,
        error: error && error.message ? error.message : String(error)
      }, event.origin);
    }
  });

  window.addEventListener('load', () => {
    // 親ページのオリジンは読めないため、許可リストの各オリジン宛てに準備完了を通知する
    ALLOWED_ORIGINS.forEach(origin => {
      window.top.postMessage({ type: 'DAILY_CORE_BRIDGE_READY' }, origin);
    });
  });
})();
</script>
</body>
</html>
