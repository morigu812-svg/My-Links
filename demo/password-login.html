<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>My Links | Password Demo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1020;color:#eef2ff;font-family:system-ui,sans-serif}
    main{width:100%;max-width:390px;padding:30px;background:#151c30;border:1px solid #303b56;border-radius:22px;box-shadow:0 20px 60px #0004}
    .logo{color:#91aaff;font-size:13px;letter-spacing:3px}h1{margin-bottom:8px}p{color:#aab6d0;line-height:1.7}
    label{display:block;margin:22px 0 8px;font-size:14px}input{width:100%;padding:14px;border:1px solid #43506c;border-radius:11px;background:#0c1324;color:white;font-size:16px}
    button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:11px;background:#91aaff;color:#10172b;font-size:15px;font-weight:700;cursor:pointer}
    #message{min-height:24px;margin-top:16px;font-size:14px}.notice{margin-top:24px;font-size:12px;color:#f5cf82}#app{display:none}
  </style>
</head>
<body>
  <main>
    <section id="login">
      <div class="logo">MY LINKS</div><h1>ログイン</h1>
      <p>デモ用パスワードを入力してください。</p>
      <form id="loginForm">
        <label for="password">パスワード</label>
        <input id="password" type="password" placeholder="デモ用パスワード" autocomplete="current-password" required>
        <button type="submit">ログイン</button>
      </form>
      <div id="message" role="status" aria-live="polite"></div>
      <p class="notice">DEMO ONLY：これは公開用の動作確認サンプルです。入力判定はブラウザ内だけで行われ、誰でもコードを読んで回避できます。本番の保護には使用しないでください。</p>
    </section>
    <section id="app">
      <div class="logo">MY LINKS</div><h1>ログイン成功！</h1>
      <p>デモ画面へようこそ。認証済みのように見せる画面遷移だけを確認できます。</p>
      <button id="logout" type="button">ログアウト</button>
    </section>
  </main>
  <script>
    // 公開リポジトリに実際のパスワードを置かないこと。
    // この文字列は使い捨てのデモ用であり、本番認証ではない。
    const DEMO_PASSWORD = "DEMO-ONLY-1234";
    const login = document.getElementById("login");
    const app = document.getElementById("app");
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const message = document.getElementById("message");

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (password.value === DEMO_PASSWORD) {
        password.value = "";
        message.textContent = "";
        login.style.display = "none";
        app.style.display = "block";
      } else {
        message.textContent = "パスワードが違います。デモ用パスワードを確認してください。";
        message.style.color = "#ff9999";
        password.value = "";
        password.focus();
      }
    });
    document.getElementById("logout").addEventListener("click", () => {
      app.style.display = "none";
      login.style.display = "block";
      message.textContent = "ログアウトしました。";
      message.style.color = "#aab6d0";
      password.focus();
    });
  </script>
</body>
</html>
