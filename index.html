<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINK CORE</title>
<style>
:root {
  color-scheme:dark; --bg:#0b1020; --panel:rgba(255,255,255,.07); --panel-2:rgba(255,255,255,.1);
  --ink:#f4f8fc; --sub:#b5c5d4; --muted:#8297aa; --line:#2a3d50;
  --accent:#5af2d6; --accent-ink:#071a18; --star:#ffda75; --danger:#ff7f91;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.7 "BIZ UDPGothic","Yu Gothic UI",system-ui,sans-serif;background:radial-gradient(ellipse at 12% 5%,rgba(95,145,255,.30),transparent 34%),radial-gradient(ellipse at 90% 20%,rgba(190,126,255,.22),transparent 32%),radial-gradient(ellipse at 52% 80%,rgba(91,220,230,.12),transparent 42%),linear-gradient(145deg,#0b1020,#14182c 52%,#090e1b)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(106,167,190,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(106,167,190,.07) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 82%);z-index:-1}
main{max-width:980px;margin:0 auto;padding:24px 24px 24px}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hero{position:relative;padding:24px 28px 20px;border:1px solid #304759;border-radius:26px;overflow:hidden;background:linear-gradient(125deg,rgba(255,255,255,.14),rgba(255,255,255,.035) 60%,rgba(180,160,255,.08));box-shadow:0 18px 55px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%)}
.hero::after{content:"LC";position:absolute;right:18px;top:-48px;font-size:230px;line-height:1;font-weight:900;letter-spacing:-.12em;color:rgba(104,236,222,.035);pointer-events:none}
.hero-top{position:relative;z-index:1;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.brand-mark{display:flex;align-items:flex-end;gap:3px;height:20px;padding:3px 7px;border:1px solid #326071;border-radius:5px;background:#0b1b27}
.brand-mark span{display:block;width:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px rgba(90,242,214,.3)}
.brand-mark span:nth-child(1){height:7px}.brand-mark span:nth-child(2){height:13px}.brand-mark span:nth-child(3){height:10px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.15em;color:#b9d0dc}
.eyebrow i,.site-footer i{color:var(--accent);font-style:normal}
.live-pill{display:flex;align-items:center;gap:7px;margin-left:auto;padding:5px 9px;border:1px solid #31594f;border-radius:99px;background:rgba(24,73,62,.3);font-size:10px;letter-spacing:.1em;color:#a9f9e9}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px var(--accent)}
h1{position:relative;z-index:1;margin:15px 0 0;font-size:clamp(34px,6vw,54px);font-weight:900;letter-spacing:.04em;line-height:1.12;color:#f8fbff}
h1 span{color:var(--accent);text-shadow:0 0 25px rgba(90,242,214,.18)}
h1 sup{margin-left:8px;vertical-align:top;font-size:11px;letter-spacing:.1em;color:#8aa6b7}
.hero-copy{position:relative;z-index:1;margin:12px 0 23px;font-size:16px;font-weight:650;color:#e4edf5}
.hero-copy span{display:inline-block;margin-top:3px;color:#8fa9bb;font-size:12px;font-weight:500;letter-spacing:.04em}
.hero-line{position:relative;z-index:1;display:flex;align-items:center;gap:12px;font-size:9px;font-weight:800;letter-spacing:.12em;color:#7f9cad}
.line-fill{height:1px;flex:1;background:linear-gradient(90deg,#3b6a78,transparent)}
.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 26px}
.stat-card{position:relative;display:flex;align-items:center;gap:13px;min-height:96px;padding:17px;border:1px solid rgba(235,242,255,.2);border-radius:20px;background:rgba(255,255,255,.07);box-shadow:0 18px 55px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);overflow:hidden;transition:transform .2s,border-color .2s}
.stat-card::after{content:"";position:absolute;right:-20px;bottom:-34px;width:90px;height:90px;border:1px solid rgba(90,242,214,.08);border-radius:50%;box-shadow:0 0 0 12px rgba(90,242,214,.025),0 0 0 25px rgba(90,242,214,.02)}
.stat-main{border-color:#376c6c;background:linear-gradient(135deg,rgba(19,54,57,.8),rgba(13,28,39,.96))}
.stat-icon{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border:1px solid #356173;border-radius:10px;background:#102b39;color:var(--accent);font-size:22px}
.star-icon{color:var(--star);border-color:#6c5933;background:#2a2519}.folder-icon{color:#c4b6ff;border-color:#554a7a;background:#211d35}
.stat-card>div{display:flex;flex-direction:column;min-width:0}
.stat-label{font-size:12px;color:#b8c8d6}
.stat-card strong{font-size:27px;line-height:1.2;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums}
.stat-foot{position:absolute;right:12px;top:10px;font-size:8px;letter-spacing:.1em;color:#657e90}
.workspace{padding:23px;border:1px solid #2c4053;border-radius:16px;background:rgba(255,255,255,.065);box-shadow:0 22px 55px rgba(0,0,0,.16)}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 20px}
.section-kicker{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--accent)}
.section-heading h2{margin:3px 0 0;font-size:25px;line-height:1.3;letter-spacing:.02em}
.heading-dot{color:var(--accent)}
.section-note{padding-bottom:4px;font-size:9px;font-weight:800;letter-spacing:.12em;color:#7891a4}
.bar{display:flex;gap:10px;margin-bottom:18px}
.search-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:0;margin:0;padding:0 13px;border:1px solid #3a5065;border-radius:9px;background:#0a121d;color:var(--accent)}
.search-wrap>span{font-size:27px;line-height:1;font-weight:400}
.search-wrap input{width:100%;min-width:0;padding:13px 0;border:0;outline:0;background:transparent;color:var(--ink)}
.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,242,214,.09)}
.search-wrap input::placeholder{color:#90a5b7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;border:1px solid #41586c;border-radius:9px;background:#172536;font-weight:700;transition:transform .16s,border-color .16s,background .16s}
.btn:hover{border-color:var(--accent);background:#203749;transform:translateY(-1px)}
.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 20px rgba(90,242,214,.12);font-weight:850}
.btn.primary:hover{background:#a2fff0}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.plus{font-size:19px;line-height:1}
.filter-heading{display:flex;justify-content:space-between;gap:10px;margin:0 0 9px;font-size:12px;font-weight:750;color:#d8e4ed}
.filter-hint{font-size:9px;letter-spacing:.1em;color:#6f8a9e}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{padding:6px 13px;border:1px solid #344a5f;border-radius:999px;background:#111e2c;font-size:12px;color:#cbd7e2;font-weight:650;transition:all .15s}
.chip:hover{color:var(--accent);border-color:var(--accent)}
.chip[aria-pressed="true"]{background:#16433f;border-color:var(--accent);color:#b3fff1;box-shadow:inset 0 0 14px rgba(90,242,214,.05)}
.list-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 1px 10px;border-top:1px solid #25394b}
.list-heading-title{font-size:10px;font-weight:850;letter-spacing:.13em;color:#b5c8d7}
.result-count{font-size:11px;color:#8ca5b7}
#status{min-height:0;margin:0;font-size:12px;color:#a1ffed}
#status:not(:empty){padding:8px 11px;margin-bottom:9px;border:1px solid #27564f;border-radius:7px;background:rgba(20,72,61,.22)}
#status.error{color:#ffacb8;border-color:#6a3544;background:rgba(92,30,48,.2)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;overflow:visible;border:0;background:transparent}
.item{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:14px;min-width:0;min-height:195px;padding:18px;border:1px solid rgba(211,228,255,.17);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));box-shadow:0 8px 22px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .18s,border-color .18s,background .18s}
.item:hover{transform:translateY(-3px);border-color:rgba(90,242,214,.5);background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.055))}
.item .star{position:absolute;z-index:2;top:17px;right:17px;flex:none;width:29px;height:29px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(10,17,30,.65);backdrop-filter:blur(10px)}
.item .body{flex:1;min-width:0;width:100%}
.item .title{display:block;font-size:16px;line-height:1.5;white-space:normal;overflow-wrap:anywhere}
.item .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:#94aabd;min-width:0}
.item .tag{display:inline-flex;align-items:center;max-width:100%;margin:0;padding:2px 8px;font-size:11px;line-height:1.5;white-space:normal;overflow-wrap:anywhere}
.item .memo{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.5}
.item .acts{display:flex;gap:6px;width:100%;margin-top:auto}
.item .acts button{flex:1;padding:7px 5px;font-size:13px}
.star{display:grid;place-items:center;flex:0 0 28px;width:28px;height:30px;padding:0;border:1px solid transparent;border-radius:7px;background:transparent;font-size:20px;line-height:1;color:#74899a}
.star:hover{background:#202c38;color:var(--star)}
.star[aria-pressed="true"]{color:var(--star);text-shadow:0 0 12px rgba(255,218,117,.25)}
.body{flex:1;min-width:0}
.title{display:inline-block;font-size:16px;line-height:1.55;font-weight:800;color:#f5f8fb;text-decoration:none;overflow-wrap:anywhere}
.title:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.meta{font-size:12px;color:#a7bac9;overflow-wrap:anywhere;margin-top:4px}
.tag{display:inline-block;margin:4px 0 0 7px;padding:2px 8px;border:1px solid #376173;border-radius:999px;background:#142f3a;font-size:10px;color:#a9fff1}
.memo{font-size:13px;color:#c3d0db;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.acts button{border:1px solid #3b5064;border-radius:6px;background:#142131;padding:5px 9px;font-size:12px;font-weight:700;color:#d5e0e9}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts .del:hover{border-color:var(--danger);color:#ffadba}
.empty{padding:42px 18px;text-align:center;color:#b4c5d3}
.empty::before{content:"↗";display:block;margin-bottom:7px;font-size:25px;color:var(--accent)}
.site-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 4px 0;color:#6f879a;font-size:9px;font-weight:750;letter-spacing:.12em}
.site-footer b{color:var(--accent);font-size:13px;letter-spacing:0}
dialog{width:min(560px,calc(100% - 24px));border:1px solid #47657a;border-radius:14px;background:#101a27;color:var(--ink);padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.65)}
dialog::backdrop{background:rgba(0,3,10,.78);backdrop-filter:blur(3px)}
dialog h2{font-size:21px;color:var(--accent);margin:0 0 16px}
dialog label{display:block;font-size:13px;color:#d1dce7;font-weight:700;margin:13px 0 5px}
dialog input[type=text],dialog input[type=url],dialog textarea{width:100%;padding:12px;border:1px solid #43586b;border-radius:7px;background:#080f18}
dialog input:focus,dialog textarea:focus{border-color:var(--accent);outline:2px solid rgba(80,245,220,.2)}
.check{display:flex!important;align-items:center;gap:9px;margin-top:15px!important;color:var(--ink)!important;font-size:14px!important}
.check input{accent-color:var(--accent);width:17px;height:17px}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@media(max-width:650px){main{padding:18px 12px 18px}.hero{padding:20px 17px 17px}.hero::after{right:8px;top:-16px;font-size:140px}.overview{gap:8px;margin:12px 0 18px}.stat-card{min-height:100px;display:block;padding:13px 11px}.stat-icon{width:30px;height:30px;min-width:30px;display:inline-grid;margin-right:7px;font-size:17px}.stat-card>div{display:inline-flex;vertical-align:middle}.stat-label{font-size:11px}.stat-card strong{font-size:23px}.stat-foot{position:static;display:block;margin-top:7px;font-size:7px}.workspace{padding:16px 12px;border-radius:12px}.section-heading h2{font-size:22px}.section-note{max-width:110px;text-align:right;font-size:8px}.bar{flex-wrap:wrap}.search-wrap{flex-basis:100%}.bar>.btn{width:100%;min-height:46px}.list{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}.item{min-height:120px;padding:10px}.item .title{font-size:12px}.item .acts{gap:4px}.item .acts button{padding:5px 4px;font-size:10px}.site-footer{justify-content:center;text-align:center}.site-footer span:last-child{width:100%}}
@media(max-width:390px){.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.live-pill{font-size:9px}.eyebrow{font-size:8px}.overview{grid-template-columns:repeat(3,minmax(0,1fr))}.stat-card{padding:10px 8px}.stat-icon{margin:0 0 6px}.stat-card>div{display:flex}.stat-label{font-size:10px}.stat-card strong{font-size:21px}.item{flex-wrap:wrap}.body{flex-basis:calc(100% - 42px)}.acts{margin-left:35px}.hero-line{font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto;transition:none!important}}
/* glass style */

/* 暗所モード：白・ネオン色を抑え、明るい面をほぼ黒にする */
body.night-mode{background:#050505}
body.night-mode::before{opacity:0}
body.night-mode .finder-window{filter:grayscale(1) brightness(.52);background:#080808;border-color:#222}
body.night-mode .finder-window,
body.night-mode .finder-window *{color:#a0a0a0!important;text-shadow:none!important}
body.night-mode .finder-window h1,
body.night-mode .finder-window h2,
body.night-mode .finder-window h3,
body.night-mode .finder-window strong,
body.night-mode .finder-window .title{color:#b0b0b0!important}
body.night-mode .finder-window input,
body.night-mode .finder-window textarea,
body.night-mode .finder-window select{color:#a0a0a0!important;background:#080808!important;border-color:#292929!important}
body.night-mode .finder-window input::placeholder,
body.night-mode .finder-window textarea::placeholder{color:#555!important}
body.night-mode .finder-window button{color:#999!important}
body.night-mode .finder-window button:hover{color:#c0c0c0!important}

body.night-mode .finder-toolbar{background:#090909}
body.night-mode .sidebar{background:#070707}
body.night-mode .finder-content{background:#050505}
body.night-mode .item{background:#090909;border-color:#242424;box-shadow:none}
body.night-mode .item:hover{background:#101010;border-color:#444}
body.night-mode .workspace,body.night-mode .width-control{background:#050505}
body.night-mode .search-wrap,body.night-mode .toolbar-search,body.night-mode .btn,body.night-mode .acts button,body.night-mode .chip{background:#090909;border-color:#292929}
body.night-mode .btn.primary{background:#171717;border-color:#444;color:#e0e0e0;box-shadow:none}
body.night-mode .site-footer{color:#777}
body.night-mode .site-footer b,body.night-mode .site-footer i{color:#aaa}
body.night-mode .toolbar-tools button{color:#e0e0e0}
body.night-mode .stat-card,body.night-mode .hero{background:#080808;border-color:#242424;box-shadow:none}
body.night-mode .stat-icon,body.night-mode .star-icon,body.night-mode .folder-icon{background:#101010;border-color:#303030;color:#ccc}
body.night-mode .chip[aria-pressed="true"],body.night-mode .side-item.selected{background:#181818;border-color:#3a3a3a;color:#eee;box-shadow:none}
body.night-mode .tag{background:#101010;border-color:#303030;color:#ccc}
body.night-mode .live-pill{background:#101010;border-color:#303030;color:#ccc}
body.night-mode .live-dot{background:#aaa;box-shadow:none}
body.night-mode .star,body.night-mode .star[aria-pressed="true"]{color:#aaa;text-shadow:none}
body.night-mode h1 span,body.night-mode .section-kicker,body.night-mode .heading-dot,body.night-mode .search-wrap,body.night-mode .empty::before{color:#aaa;text-shadow:none}

/* Finder-inspired desktop shell */

.finder-window{position:relative}
.resize-handle{position:absolute;top:78px;bottom:0;width:14px;z-index:20;cursor:ew-resize;touch-action:none}
.resize-left{left:0}.resize-right{right:0}
.resize-handle::after{content:"";position:absolute;top:45%;bottom:45%;left:6px;width:2px;border-radius:2px;background:rgba(180,205,230,0);transition:background .15s}
.resize-handle:hover::after,.resize-handle:active::after{background:rgba(180,205,230,.8)}
body.is-resizing{cursor:ew-resize!important;user-select:none}
/* ドラッグ中は重いぼかし・影を止め、幅変更を軽くする */
body.is-resizing .finder-window{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
body.is-resizing .finder-content{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
@media(max-width:760px){.resize-handle{display:none}}


.width-control{width:100%;max-width:var(--finder-width,1180px);margin:0 auto 10px;display:flex;align-items:center;gap:18px;padding:9px 14px;border:1px solid rgba(190,205,230,.18);border-radius:10px;background:rgba(20,26,39,.72);color:#cbd5e5;font-size:12px}
.width-control label{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;white-space:nowrap;flex:0 0 auto}
.width-control strong{color:#8ff7e4;font-variant-numeric:tabular-nums}
.width-control input{width:100%;min-width:70px;accent-color:#5af2d6;cursor:ew-resize}
@media(max-width:760px){.width-control{display:none}.finder-window{max-width:100%!important;width:100%}}

main{max-width:none;margin:0;padding:28px 24px;min-height:100vh}

.finder-toolbar{height:78px;display:grid;grid-template-columns:190px 1fr 220px;grid-template-rows:38px 32px;align-items:center;padding:7px 18px 8px;border-bottom:1px solid rgba(255,255,255,.09);background:linear-gradient(#292f3b,#202631)}
.traffic-lights{grid-column:1;grid-row:1;display:flex;gap:8px;align-items:center}

.traffic-lights span:nth-child(1){background:#ff5f57}.traffic-lights span:nth-child(2){background:#febc2e}.traffic-lights span:nth-child(3){background:#28c840}
.finder-title{grid-column:2;grid-row:1;justify-self:center;font-size:15px;font-weight:650;color:#e7edf7;display:flex;align-items:center;gap:9px}
.folder-glyph{color:#65b8ff;font-size:20px}.toolbar-chevron{color:#8c9bad;font-size:22px}
.toolbar-tools{grid-column:1;grid-row:2;display:flex;gap:6px;color:#d6deeb;font-size:16px}
.toolbar-tools span{display:grid;place-items:center;width:29px;height:25px;border-radius:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06)}
.toolbar-tools button{display:grid;place-items:center;width:29px;height:25px;padding:0;border-radius:5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06);color:#d6deeb;font:inherit;line-height:1;cursor:pointer;box-shadow:none}
.toolbar-tools button:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.12)}
.toolbar-search{grid-column:3;grid-row:1 / span 2;display:flex;align-items:center;gap:8px;padding:0 11px;height:32px;border:1px solid rgba(255,255,255,.09);border-radius:8px;background:rgba(5,9,16,.28);color:#bdc9da}
.toolbar-search span{font-size:23px}.toolbar-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f3f6fc}.toolbar-search input::placeholder{color:#9aa8ba}
.finder-layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:650px}
.sidebar{padding:14px 9px 20px;background:linear-gradient(180deg,rgba(45,53,67,.74),rgba(30,37,49,.76));border-right:1px solid rgba(255,255,255,.08)}
.side-label{margin:17px 11px 7px;font-size:11px;color:#9caabd;font-weight:650}
.side-item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:7px 11px;border:1px solid transparent;border-radius:7px;background:transparent;color:#dce5f2;font-size:13px}
.side-item>span{width:18px;text-align:center;font-size:17px;color:#aab8ca}
.side-item:hover{background:rgba(255,255,255,.07)}.side-item.selected{background:rgba(123,151,190,.25);border-color:rgba(255,255,255,.05);color:#fff}
.side-item.selected>span{color:#f3f7ff}
.side-cats{display:flex;flex-direction:column;gap:2px}.side-cats .side-item{font-size:12px;padding-top:5px;padding-bottom:5px}
.finder-content{min-width:0;padding:20px 23px 26px;background:rgba(7,11,18,.28)}
.workspace{padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}
.section-heading{align-items:center;margin-bottom:19px}.section-heading h2{font-size:23px;font-weight:650;letter-spacing:0}.section-kicker{font-size:9px}
.bar{margin-bottom:12px}.bar .btn{min-width:145px}
.list-heading{padding-top:10px}
.site-footer{max-width:1180px;margin:0 auto;color:#8390a4;padding:12px 5px}
@media(max-width:760px){main{padding:8px}.finder-toolbar{grid-template-columns:60px 1fr;grid-template-rows:30px 32px;height:72px;padding:5px 10px}.finder-title{grid-column:2;grid-row:1;justify-self:start}.toolbar-tools{grid-column:1;grid-row:2}.toolbar-search{grid-column:2;grid-row:2}.finder-layout{grid-template-columns:145px minmax(0,1fr)}.sidebar{padding:10px 5px}.side-item{font-size:11px;padding:7px 5px;gap:5px}.side-label{margin:13px 5px 5px}.finder-content{padding:15px 10px}.list{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:9px}.item{min-height:115px;padding:9px}.file-preview{height:78px}.bar{flex-wrap:wrap}.bar>.btn{width:100%}.section-note{display:none}}
@media(max-width:520px){main{padding:0}.finder-window{border-radius:0;min-height:100vh}.finder-layout{grid-template-columns:112px minmax(0,1fr)}.side-item{font-size:10px}.side-item>span{width:14px;font-size:14px}.finder-content{padding:12px 8px}.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.item .title{font-size:11px}.item .acts button{font-size:9px}.finder-title{font-size:13px}.toolbar-tools{display:none}.finder-toolbar{grid-template-columns:48px 1fr}}

</style>
</head>
<body>
<div class="finder-window" id="finderWindow"><div class="resize-handle resize-left" data-resize="left" role="separator" aria-label="左端をドラッグして幅を変更"></div><div class="resize-handle resize-right" data-resize="right" role="separator" aria-label="右端をドラッグして幅を変更"></div>
  <header class="finder-toolbar">
    <div class="traffic-lights" aria-label="ウィンドウ操作"><span></span><span></span><span></span></div>
    <div class="finder-title"><span class="folder-glyph">▰</span> My Desktop <span class="toolbar-chevron">›</span></div>
    <div class="toolbar-tools"><span>▤</span><span>☷</span><button id="nightModeBtn" type="button" aria-pressed="false" aria-label="暗所モードをオンにする" title="暗所モード">◐</button></div>
    <label class="toolbar-search" for="search"><span>⌕</span><input id="search" type="search" placeholder="検索" aria-label="検索"></label>
  </header>
  <div class="finder-layout">
    <aside class="sidebar" aria-label="サイドバー">
      <button class="side-item selected" type="button" data-view="all"><span>▣</span> My Desktop</button>
      <div class="side-label">よく使う項目</div>
      <button class="side-item" type="button" data-view="favorites"><span>★</span> お気に入り</button>
      <button class="side-item" type="button" data-view="recent"><span>◷</span> 最近追加した項目</button>
      <button class="side-item" type="button" data-view="all"><span>▦</span> すべてのリンク</button>
      <div class="side-label">カテゴリ</div>
      <div id="sideCats" class="side-cats"></div>
      <div class="side-label">アクション</div>
      <button class="side-item" type="button" id="sideAdd"><span>＋</span> リンクを追加</button>
    </aside>
    <main class="finder-content">
  <section class="workspace" aria-label="リンク一覧">
    <div class="section-heading">
      <div><span class="section-kicker">MY DESKTOP / LINK LIBRARY</span><h2 id="viewTitle">My Desktop</h2></div>
      <span class="section-note">ICON VIEW</span>
    </div>
    <div class="bar">
      <button id="addBtn" class="btn primary" type="button"><span class="plus" aria-hidden="true">＋</span> リンクを追加</button>
    </div>
    <div class="list-heading"><span class="list-heading-title"><span class="heading-dot">◆</span> LINK FEED</span><span id="resultCount" class="result-count">読み込み中…</span></div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="list" class="list"></div>
  </section>
    </main>
  </div>
  </div>
  <footer class="site-footer"><span><b>LC.</b> LINK CORE</span><span>YOUR LINKS. YOUR FLOW.</span><span>DESIGNED TO STAY ORGANIZED <i>✳</i></span></footer>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">リンクを追加</h2>
    <input type="hidden" id="fId">
    <label for="fTitle">タイトル</label>
    <input id="fTitle" type="text" maxlength="200" required>
    <label for="fUrl">URL</label>
    <input id="fUrl" type="text" inputmode="url" placeholder="https://example.com" required>
    <label for="fCat">カテゴリ</label>
    <input id="fCat" type="text" maxlength="50" list="catList">
    <datalist id="catList"></datalist>
    <label for="fMemo">メモ</label>
    <textarea id="fMemo" rows="3"></textarea>
    <label class="check"><input id="fFav" type="checkbox"> お気に入りにする</label>
    <div class="foot">
      <button id="cancelBtn" class="btn" type="button">キャンセル</button>
      <button id="saveBtn" class="btn primary" type="submit">保存する</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const finderWindow = $('finderWindow');
  function setFinderWidth(width) {
    const min = 600, max = 1800;
    width = Math.max(min, Math.min(max, Math.round(width)));
    finderWindow.style.maxWidth = width + 'px';
  }
  document.querySelectorAll('.resize-handle').forEach(handle => {
    handle.addEventListener('pointerdown', event => {
      if (window.matchMedia('(max-width: 760px)').matches) return;
      event.preventDefault();
      handle.setPointerCapture(event.pointerId);
      const startX = event.clientX;
      const startWidth = finderWindow.getBoundingClientRect().width;
      const side = handle.dataset.resize;
      document.body.classList.add('is-resizing');
      const move = e => {
        const delta = e.clientX - startX;
        setFinderWidth(startWidth + (side === 'right' ? delta * 2 : -delta * 2));
      };
      const stop = () => {
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', stop);
        handle.removeEventListener('pointercancel', stop);
        document.body.classList.remove('is-resizing');
      };
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', stop);
      handle.addEventListener('pointercancel', stop);
    });
  });
  const nightModeBtn = $('nightModeBtn');
  nightModeBtn.addEventListener('click', () => {
    const enabled = document.body.classList.toggle('night-mode');
    nightModeBtn.setAttribute('aria-pressed', String(enabled));
    nightModeBtn.setAttribute('aria-label', enabled ? '暗所モードをオフにする' : '暗所モードをオンにする');
    nightModeBtn.title = enabled ? '暗所モードをオフにする' : '暗所モード';
  });

  const state = { links: [], categories: [], category: '', query: '', busy: false, view: 'all' };

  // GAS Webアプリ（?mode=bridge）を隠しiframeで読み込み、postMessageで通信する。
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxjt4DTo0EmNqWZ5Mt5MgqlioxcLXmDhaBwaXwn91YC9XFkX8-HvKC2Nxfe7rQk98JMpA/exec';
  const pending = new Map();
  let bridgeWindow = null;
  let bridgeOrigin = '';
  let markReady;
  const ready = new Promise(resolve => { markReady = resolve; });

  function isGasOrigin(origin) {
    return origin === 'https://script.google.com' ||
      /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(origin);
  }

  window.addEventListener('message', event => {
    if (!isGasOrigin(event.origin)) return;
    const data = event.data;
    if (!data || typeof data !== 'object') return;

    if (data.type === 'DAILY_CORE_BRIDGE_READY') {
      bridgeWindow = event.source;
      bridgeOrigin = event.origin;
      markReady();
      return;
    }

    if (data.type === 'DAILY_CORE_RESPONSE' && event.source === bridgeWindow) {
      const entry = pending.get(data.id);
      if (!entry) return;
      pending.delete(data.id);
      clearTimeout(entry.timer);
      data.ok ? entry.resolve(data.result) : entry.reject(new Error(data.error || '通信に失敗しました。'));
    }
  });

  const frame = document.createElement('iframe');
  frame.src = GAS_URL + '?mode=bridge';
  frame.title = 'LINK CORE bridge';
  frame.hidden = true;
  document.body.appendChild(frame);

  function serverCall(method, ...args) {
    const wait = new Promise((_, reject) => setTimeout(
      () => reject(new Error('GASに接続できません。デプロイの「アクセスできるユーザー」が「全員」か確認してください。')),
      20000));

    return Promise.race([ready, wait]).then(() => new Promise((resolve, reject) => {
      const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random());
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error('GASからの応答がありません。'));
      }, 30000);
      pending.set(id, { resolve, reject, timer });
      bridgeWindow.postMessage({ type: 'DAILY_CORE_REQUEST', id, method, args }, bridgeOrigin);
    }));
  }

  function esc(text) {
    return String(text).replace(/[&<>"']/g, ch => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]
    ));
  }

  // 保存済みでも、表示時に http / https 以外は無効化する。
  function safeHref(url) {
    return /^https?:\/\//i.test(url) ? url : '#';
  }

  function host(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (_) { return url; }
  }

  function setStatus(text, kind) {
    const el = $('status');
    el.textContent = text || '';
    el.className = kind || '';
  }

  function setBusy(value) {
    state.busy = value;
    $('addBtn').disabled = value;
    $('saveBtn').disabled = value;
  }

  function apply(data) {
    state.links = data.links;
    state.categories = data.categories;
    if (state.category && state.categories.indexOf(state.category) === -1) state.category = '';
    render();
  }

  function visibleLinks() {
    const q = state.query.trim().toLowerCase();

    return state.links
      .filter(link => state.view !== 'favorites' || link.favorite)
      .filter(link => state.view !== 'recent' || true)
      .filter(link => !state.category || link.category === state.category)
      .filter(link => !q || [link.title, link.url, link.memo, link.category]
        .some(text => text.toLowerCase().includes(q)))
      .sort((a, b) =>
        (b.favorite - a.favorite) || b.createdAt.localeCompare(a.createdAt));
  }

  function render() {
    $('sideCats').innerHTML = state.categories.map(cat =>
      `<button type="button" class="side-item ${state.category === cat ? 'selected' : ''}" data-side-cat="${esc(cat)}"><span>▸</span> ${esc(cat)}</button>`
    ).join('');
    $('catList').innerHTML = state.categories.map(c => `<option value="${esc(c)}">`).join('');

    const links = visibleLinks();
    $('resultCount').textContent = `${links.length} / ${state.links.length} 件を表示`;

    if (!links.length) {
      $('list').innerHTML = `<div class="empty">${
        state.links.length ? '条件に合うリンクがありません。' : 'まだリンクがありません。「リンクを追加」から登録してください。'
      }</div>`;
      return;
    }

    $('list').innerHTML = links.map(link => `
      <div class="item" data-id="${esc(link.id)}">
        
        <button type="button" class="star" aria-pressed="${link.favorite}" aria-label="お気に入り">★</button>
        <div class="body">
          <a class="title" href="${esc(safeHref(link.url))}" target="_blank" rel="noopener noreferrer">${esc(link.title)}</a>
          <div class="meta">${esc(host(link.url))}${link.category ? `<span class="tag">${esc(link.category)}</span>` : ''}</div>
          ${link.memo ? `<div class="memo">${esc(link.memo)}</div>` : ''}
        </div>
        <div class="acts">
          <button type="button" class="edit">編集</button>
          <button type="button" class="del">削除</button>
        </div>
      </div>`).join('');
  }

  async function run(label, task, doneText) {
    if (state.busy) return;
    setBusy(true);
    setStatus(label);
    try {
      apply(await task());
      setStatus(doneText, '');
    } catch (error) {
      setStatus(label.replace('…', '') + 'に失敗しました：' + error.message, 'error');
    } finally {
      setBusy(false);
    }
  }

  function openForm(link) {
    $('form').reset();
    $('fId').value = link ? link.id : '';
    $('fTitle').value = link ? link.title : '';
    $('fUrl').value = link ? link.url : '';
    $('fCat').value = link ? link.category : state.category;
    $('fMemo').value = link ? link.memo : '';
    $('fFav').checked = link ? link.favorite : false;
    $('dlgTitle').textContent = link ? 'リンクを編集' : 'リンクを追加';
    $('saveBtn').textContent = link ? '変更を保存' : '保存する';
    $('dlg').showModal();
    $('fTitle').focus();
  }

  $('addBtn').addEventListener('click', () => openForm(null));
  $('cancelBtn').addEventListener('click', () => $('dlg').close());

  $('form').addEventListener('submit', event => {
    event.preventDefault();
    const input = {
      id: $('fId').value,
      title: $('fTitle').value,
      url: $('fUrl').value,
      category: $('fCat').value,
      memo: $('fMemo').value,
      favorite: $('fFav').checked
    };
    $('dlg').close();
    run('保存中…', () => serverCall('saveLink', input), '保存しました。');
  });

  $('search').addEventListener('input', event => {
    state.query = event.target.value;
    render();
  });

  $('sideCats').addEventListener('click', event => {
    const button = event.target.closest('[data-side-cat]');
    if (!button) return;
    state.category = button.dataset.sideCat;
    state.view = 'all';
    $('viewTitle').textContent = state.category;
    updateSidebar();
    render();
  });

  function updateSidebar() {
    document.querySelectorAll('[data-view]').forEach(button => button.classList.toggle('selected', button.dataset.view === state.view && !state.category));
  }
  document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
    state.view = button.dataset.view;
    state.category = '';
    $('viewTitle').textContent = state.view === 'favorites' ? 'お気に入り' : state.view === 'recent' ? '最近追加した項目' : 'My Desktop';
    updateSidebar();
    render();
  }));
  $('sideAdd').addEventListener('click', () => openForm(null));

  $('list').addEventListener('click', event => {
    const item = event.target.closest('.item');
    if (!item) return;
    const link = state.links.find(l => l.id === item.dataset.id);
    if (!link) return;

    if (event.target.closest('.star')) {
      run('更新中…', () => serverCall('toggleFavorite', link.id, !link.favorite), '');
    } else if (event.target.closest('.edit')) {
      openForm(link);
    } else if (event.target.closest('.del')) {
      if (confirm(`「${link.title}」を削除しますか？`)) {
        run('削除中…', () => serverCall('deleteLink', link.id), '削除しました。');
      }
    }
  });

  run('読み込み中…', () => serverCall('getLinks'), '');
})();
</script>
</body>
</html>
