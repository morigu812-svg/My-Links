<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINK CORE</title>
<style>
:root {
  color-scheme: dark;
  --bg:#05070d; --panel:#0b111c; --ink:#e7fbff; --sub:#8ba5b5;
  --line:#18384a; --accent:#00f5d4; --accent-ink:#031014;
  --star:#f5d742; --danger:#ff5470; --tag:#102c38;
  --glow:0 0 22px rgba(0,245,212,.08);
}
* { box-sizing:border-box; }
html { min-height:100%; background:var(--bg); }
body {
  margin:0; min-height:100vh; color:var(--ink);
  background:
    radial-gradient(ellipse at 50% -15%, rgba(0,210,255,.13), transparent 55%),
    linear-gradient(rgba(0,245,212,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,212,.035) 1px, transparent 1px),
    var(--bg);
  background-size:auto,32px 32px,32px 32px,auto;
  font:15px/1.65 "SFMono-Regular",Consolas,"BIZ UDPGothic","Yu Gothic UI",sans-serif;
}
main { max-width:860px; margin:0 auto; padding:48px 20px 72px; }
h1 {
  position:relative; margin:0 0 26px; padding:0 0 17px;
  color:#f2ffff; font-size:clamp(27px,5vw,39px); font-weight:800;
  letter-spacing:.12em; text-transform:uppercase;
  text-shadow:0 0 18px rgba(0,245,212,.3);
}
h1::before { content:"SYSTEM // PERSONAL LINK ARCHIVE"; display:block; color:var(--accent); font-size:10px; letter-spacing:.2em; margin-bottom:9px; }
h1::after { content:""; position:absolute; left:0; bottom:0; width:100%; height:1px; background:linear-gradient(90deg,var(--accent),#7657ff,transparent); }
button,input,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
.bar { display:flex; gap:10px; margin-bottom:16px; }
.bar input {
  flex:1; min-width:0; padding:12px 14px; border:1px solid var(--line);
  border-radius:4px; background:rgba(7,15,26,.92); box-shadow:inset 0 0 14px rgba(0,245,212,.025);
}
.bar input::placeholder { color:#587486; }
.btn {
  padding:11px 16px; border:1px solid #285064; border-radius:4px;
  background:#0a1522; transition:background .18s,border-color .18s,box-shadow .18s;
}
.btn:hover { border-color:var(--accent); box-shadow:0 0 15px rgba(0,245,212,.1); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:800; box-shadow:0 0 18px rgba(0,245,212,.16); }
.btn.primary:hover { background:#7affea; box-shadow:0 0 25px rgba(0,245,212,.28); }
.btn:disabled { opacity:.5; cursor:default; }
.cats { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.chip {
  padding:5px 12px; border:1px solid #1c3c4e; border-radius:3px;
  background:rgba(8,18,30,.9); font-size:12px; color:var(--sub);
  letter-spacing:.04em; transition:all .18s;
}
.chip:hover { color:var(--accent); border-color:#398296; }
.chip[aria-pressed="true"] { background:rgba(0,245,212,.12); border-color:var(--accent); color:var(--accent); box-shadow:inset 0 0 12px rgba(0,245,212,.06); }
#status { min-height:24px; font-size:12px; color:var(--accent); margin:0 0 10px; letter-spacing:.03em; }
#status.error { color:var(--danger); }
.list { overflow:hidden; background:rgba(8,14,24,.94); border:1px solid var(--line); border-radius:5px; box-shadow:var(--glow); }
.item { display:flex; gap:13px; padding:15px 16px; border-top:1px solid rgba(24,56,74,.8); transition:background .18s; }
.item:first-child { border-top:0; }
.item:hover { background:rgba(0,245,212,.035); }
.star { flex:0 0 auto; border:0; background:none; font-size:20px; line-height:1; padding:3px; color:#294253; }
.star[aria-pressed="true"] { color:var(--star); text-shadow:0 0 12px rgba(245,215,66,.35); }
.body { flex:1; min-width:0; }
.title { font-weight:700; color:#e7fbff; text-decoration:none; overflow-wrap:anywhere; }
.title:hover { color:var(--accent); text-decoration:none; text-shadow:0 0 12px rgba(0,245,212,.22); }
.meta { font-size:11px; color:#7191a4; overflow-wrap:anywhere; margin-top:3px; }
.tag { display:inline-block; margin-left:8px; padding:1px 8px; border:1px solid #1a4857; border-radius:2px; background:var(--tag); font-size:10px; color:var(--accent); }
.memo { font-size:13px; color:#91a9b8; margin-top:5px; white-space:pre-wrap; overflow-wrap:anywhere; }
.acts { display:flex; gap:5px; align-items:flex-start; }
.acts button { border:1px solid transparent; border-radius:3px; background:transparent; padding:3px 7px; font-size:12px; color:#7893a3; }
.acts button:hover { border-color:#2a5a6c; color:var(--accent); }
.acts .del:hover { border-color:#673042; color:var(--danger); }
.empty { padding:42px 18px; text-align:center; color:#7793a5; }
dialog { width:min(540px,calc(100% - 24px)); border:1px solid #236174; border-radius:6px; background:#08111e; color:var(--ink); padding:22px; box-shadow:0 0 50px rgba(0,0,0,.65),0 0 25px rgba(0,245,212,.08); }
dialog::backdrop { background:rgba(0,3,10,.78); backdrop-filter:blur(4px); }
dialog h2 { font-size:18px; color:var(--accent); margin:0 0 16px; letter-spacing:.04em; }
label { display:block; font-size:12px; color:#8ba5b5; margin:12px 0 4px; }
dialog input[type=text],dialog input[type=url],dialog textarea {
  width:100%; padding:10px 11px; border:1px solid #1b3b4d; border-radius:3px; background:#050b14;
}
dialog input:focus,dialog textarea:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 2px rgba(0,245,212,.08); }
.check { display:flex; align-items:center; gap:7px; margin-top:14px; color:var(--ink); font-size:13px; }
.check input { accent-color:var(--accent); }
.foot { display:flex; justify-content:flex-end; gap:9px; margin-top:20px; }
@media (max-width:560px) {
  main { padding:30px 13px 48px; }
  .bar { flex-wrap:wrap; }
  .bar input { flex-basis:100%; }
  .bar .btn { flex:1; }
  .item { gap:8px; padding:13px 10px; }
  .acts { flex-direction:column; gap:2px; }
  .acts button { padding:3px 5px; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; } }
</style>
</head>
<body>
<main>
  <h1>LINK CORE</h1>

  <div class="bar">
    <input id="search" type="search" placeholder="タイトル・URL・メモを検索" aria-label="検索">
    <button id="addBtn" class="btn primary" type="button">リンクを追加</button>
  </div>
  <div id="cats" class="cats" role="group" aria-label="カテゴリで絞り込む"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="list" class="list"></div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">リンクを追加</h2>
    <input type="hidden" id="fId">
    <label for="fTitle">タイトル</label>
    <input id="fTitle" type="text" maxlength="200" required>
    <label for="fUrl">URL</label>
    <input id="fUrl" type="text" inputmode="url" placeholder="https://example.com" required>
    <label for="fCat">カテゴリ</label>
    <input id="fCat" type="text" maxlength="50" list="catList">
    <datalist id="catList"></datalist>
    <label for="fMemo">メモ</label>
    <textarea id="fMemo" rows="3"></textarea>
    <label class="check"><input id="fFav" type="checkbox"> お気に入りにする</label>
    <div class="foot">
      <button id="cancelBtn" class="btn" type="button">キャンセル</button>
      <button id="saveBtn" class="btn primary" type="submit">保存する</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const state = { links: [], categories: [], category: '', query: '', busy: false };

  // GAS Webアプリ（?mode=bridge）を隠しiframeで読み込み、postMessageで通信する。
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxjt4DTo0EmNqWZ5Mt5MgqlioxcLXmDhaBwaXwn91YC9XFkX8-HvKC2Nxfe7rQk98JMpA/exec';
  const pending = new Map();
  let bridgeWindow = null;
  let bridgeOrigin = '';
  let markReady;
  const ready = new Promise(resolve => { markReady = resolve; });

  function isGasOrigin(origin) {
    return origin === 'https://script.google.com' ||
      /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(origin);
  }

  window.addEventListener('message', event => {
    if (!isGasOrigin(event.origin)) return;
    const data = event.data;
    if (!data || typeof data !== 'object') return;

    if (data.type === 'DAILY_CORE_BRIDGE_READY') {
      bridgeWindow = event.source;
      bridgeOrigin = event.origin;
      markReady();
      return;
    }

    if (data.type === 'DAILY_CORE_RESPONSE' && event.source === bridgeWindow) {
      const entry = pending.get(data.id);
      if (!entry) return;
      pending.delete(data.id);
      clearTimeout(entry.timer);
      data.ok ? entry.resolve(data.result) : entry.reject(new Error(data.error || '通信に失敗しました。'));
    }
  });

  const frame = document.createElement('iframe');
  frame.src = GAS_URL + '?mode=bridge';
  frame.title = 'LINK CORE bridge';
  frame.hidden = true;
  document.body.appendChild(frame);

  function serverCall(method, ...args) {
    const wait = new Promise((_, reject) => setTimeout(
      () => reject(new Error('GASに接続できません。デプロイの「アクセスできるユーザー」が「全員」か確認してください。')),
      20000));

    return Promise.race([ready, wait]).then(() => new Promise((resolve, reject) => {
      const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random());
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error('GASからの応答がありません。'));
      }, 30000);
      pending.set(id, { resolve, reject, timer });
      bridgeWindow.postMessage({ type: 'DAILY_CORE_REQUEST', id, method, args }, bridgeOrigin);
    }));
  }

  function esc(text) {
    return String(text).replace(/[&<>"']/g, ch => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]
    ));
  }

  // 保存済みでも、表示時に http / https 以外は無効化する。
  function safeHref(url) {
    return /^https?:\/\//i.test(url) ? url : '#';
  }

  function host(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (_) { return url; }
  }

  function setStatus(text, kind) {
    const el = $('status');
    el.textContent = text || '';
    el.className = kind || '';
  }

  function setBusy(value) {
    state.busy = value;
    $('addBtn').disabled = value;
    $('saveBtn').disabled = value;
  }

  function apply(data) {
    state.links = data.links;
    state.categories = data.categories;
    if (state.category && state.categories.indexOf(state.category) === -1) state.category = '';
    render();
  }

  function visibleLinks() {
    const q = state.query.trim().toLowerCase();

    return state.links
      .filter(link => !state.category || link.category === state.category)
      .filter(link => !q || [link.title, link.url, link.memo, link.category]
        .some(text => text.toLowerCase().includes(q)))
      .sort((a, b) =>
        (b.favorite - a.favorite) || b.createdAt.localeCompare(a.createdAt));
  }

  function render() {
    const cats = ['', ...state.categories].map(cat =>
      `<button type="button" class="chip" data-cat="${esc(cat)}" aria-pressed="${cat === state.category}">${cat ? esc(cat) : 'すべて'}</button>`
    ).join('');
    $('cats').innerHTML = cats;

    $('catList').innerHTML = state.categories.map(c => `<option value="${esc(c)}">`).join('');

    const links = visibleLinks();

    if (!links.length) {
      $('list').innerHTML = `<div class="empty">${
        state.links.length ? '条件に合うリンクがありません。' : 'まだリンクがありません。「リンクを追加」から登録してください。'
      }</div>`;
      return;
    }

    $('list').innerHTML = links.map(link => `
      <div class="item" data-id="${esc(link.id)}">
        <button type="button" class="star" aria-pressed="${link.favorite}" aria-label="お気に入り">★</button>
        <div class="body">
          <a class="title" href="${esc(safeHref(link.url))}" target="_blank" rel="noopener noreferrer">${esc(link.title)}</a>
          <div class="meta">${esc(host(link.url))}${link.category ? `<span class="tag">${esc(link.category)}</span>` : ''}</div>
          ${link.memo ? `<div class="memo">${esc(link.memo)}</div>` : ''}
        </div>
        <div class="acts">
          <button type="button" class="edit">編集</button>
          <button type="button" class="del">削除</button>
        </div>
      </div>`).join('');
  }

  async function run(label, task, doneText) {
    if (state.busy) return;
    setBusy(true);
    setStatus(label);
    try {
      apply(await task());
      setStatus(doneText, '');
    } catch (error) {
      setStatus(label.replace('…', '') + 'に失敗しました：' + error.message, 'error');
    } finally {
      setBusy(false);
    }
  }

  function openForm(link) {
    $('form').reset();
    $('fId').value = link ? link.id : '';
    $('fTitle').value = link ? link.title : '';
    $('fUrl').value = link ? link.url : '';
    $('fCat').value = link ? link.category : state.category;
    $('fMemo').value = link ? link.memo : '';
    $('fFav').checked = link ? link.favorite : false;
    $('dlgTitle').textContent = link ? 'リンクを編集' : 'リンクを追加';
    $('saveBtn').textContent = link ? '変更を保存' : '保存する';
    $('dlg').showModal();
    $('fTitle').focus();
  }

  $('addBtn').addEventListener('click', () => openForm(null));
  $('cancelBtn').addEventListener('click', () => $('dlg').close());

  $('form').addEventListener('submit', event => {
    event.preventDefault();
    const input = {
      id: $('fId').value,
      title: $('fTitle').value,
      url: $('fUrl').value,
      category: $('fCat').value,
      memo: $('fMemo').value,
      favorite: $('fFav').checked
    };
    $('dlg').close();
    run('保存中…', () => serverCall('saveLink', input), '保存しました。');
  });

  $('search').addEventListener('input', event => {
    state.query = event.target.value;
    render();
  });

  $('cats').addEventListener('click', event => {
    const chip = event.target.closest('.chip');
    if (!chip) return;
    state.category = chip.dataset.cat;
    render();
  });

  $('list').addEventListener('click', event => {
    const item = event.target.closest('.item');
    if (!item) return;
    const link = state.links.find(l => l.id === item.dataset.id);
    if (!link) return;

    if (event.target.closest('.star')) {
      run('更新中…', () => serverCall('toggleFavorite', link.id, !link.favorite), '');
    } else if (event.target.closest('.edit')) {
      openForm(link);
    } else if (event.target.closest('.del')) {
      if (confirm(`「${link.title}」を削除しますか？`)) {
        run('削除中…', () => serverCall('deleteLink', link.id), '削除しました。');
      }
    }
  });

  run('読み込み中…', () => serverCall('getLinks'), '');
})();
</script>
</body>
</html>
