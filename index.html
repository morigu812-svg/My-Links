<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINK CORE</title>
<style>
:root {
  color-scheme: dark;
  --bg:#070b12; --panel:#101925; --ink:#f2f7fc; --sub:#b8c7d6;
  --line:#2b4054; --accent:#50f5dc; --accent-ink:#071a19;
  --star:#ffe16a; --danger:#ff7187; --tag:#183642;
}
* { box-sizing:border-box; }
html { min-height:100%; background:var(--bg); scroll-behavior:smooth; }
body {
  margin:0; min-height:100vh; color:var(--ink);
  background:radial-gradient(ellipse at 50% -15%, rgba(0,210,255,.10), transparent 58%), var(--bg);
  font:16px/1.7 "BIZ UDPGothic","Yu Gothic UI",system-ui,sans-serif;
}
main { max-width:900px; margin:0 auto; padding:36px 22px 64px; }
h1 {
  margin:0 0 24px; padding:0 0 15px; border-bottom:2px solid var(--line);
  color:#fff; font-size:clamp(27px,4.5vw,36px); font-weight:800; letter-spacing:.06em;
}
h1::before { content:"PERSONAL LINK ARCHIVE"; display:block; color:var(--accent); font-size:12px; letter-spacing:.12em; margin-bottom:5px; }
h1::after { content:""; display:block; height:2px; width:100px; margin-bottom:-17px; background:var(--accent); }
button,input,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
.bar { display:flex; gap:12px; margin-bottom:18px; }
.bar input {
  flex:1; min-width:0; padding:13px 15px; border:1px solid #43586b;
  border-radius:8px; background:#0d1520;
}
.bar input::placeholder { color:#a2b4c5; }
.bar input:focus { border-color:var(--accent); outline:2px solid rgba(80,245,220,.2); }
.btn {
  padding:11px 16px; border:1px solid #536a7f; border-radius:8px;
  background:#172434; font-weight:650; transition:background .15s,border-color .15s;
}
.btn:hover { border-color:var(--accent); background:#203648; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:800; }
.btn.primary:hover { background:#a1fff0; }
.btn:disabled { opacity:.55; cursor:default; }
.cats { display:flex; flex-wrap:wrap; gap:9px; margin-bottom:18px; }
.chip {
  padding:7px 14px; border:1px solid #43566b; border-radius:999px;
  background:#111c29; font-size:14px; color:#d1dce7; font-weight:600;
}
.chip:hover { color:var(--accent); border-color:var(--accent); }
.chip[aria-pressed="true"] { background:#16443f; border-color:var(--accent); color:#a4fff0; }
#status { min-height:28px; font-size:14px; color:#8fffea; margin:0 0 10px; }
#status.error { color:#ff9cac; }
.list { overflow:hidden; background:#0e1722; border:1px solid #35495d; border-radius:10px; }
.item { display:flex; align-items:flex-start; gap:14px; padding:17px 18px; border-top:1px solid #2b3b4d; }
.item:first-child { border-top:0; }
.item:hover { background:#142331; }
.star { flex:0 0 auto; border:0; background:none; font-size:23px; line-height:1.4; padding:0 2px; color:#9aaaba; }
.star[aria-pressed="true"] { color:var(--star); }
.body { flex:1; min-width:0; }
.title { display:inline-block; font-size:17px; line-height:1.5; font-weight:750; color:#fff; text-decoration:none; overflow-wrap:anywhere; }
.title:hover { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
.meta { font-size:13px; color:#c0cedb; overflow-wrap:anywhere; margin-top:5px; }
.tag { display:inline-block; margin:4px 0 0 8px; padding:2px 9px; border:1px solid #376173; border-radius:999px; background:var(--tag); font-size:12px; color:#a9fff1; }
.memo { font-size:14px; color:#d0dbe5; margin-top:7px; white-space:pre-wrap; overflow-wrap:anywhere; }
.acts { display:flex; gap:7px; align-items:center; flex-shrink:0; }
.acts button { border:1px solid #43566b; border-radius:6px; background:#172434; padding:6px 10px; font-size:13px; font-weight:600; color:#e0e9f1; }
.acts button:hover { border-color:var(--accent); color:var(--accent); }
.acts .del:hover { border-color:var(--danger); color:#ff9cac; }
.empty { padding:42px 18px; text-align:center; color:#c0cedb; }
dialog { width:min(560px,calc(100% - 24px)); border:1px solid #47657a; border-radius:12px; background:#101a27; color:var(--ink); padding:24px; box-shadow:0 20px 70px rgba(0,0,0,.65); }
dialog::backdrop { background:rgba(0,3,10,.78); backdrop-filter:blur(3px); }
dialog h2 { font-size:21px; color:var(--accent); margin:0 0 16px; }
label { display:block; font-size:14px; color:#d1dce7; font-weight:600; margin:13px 0 5px; }
dialog input[type=text],dialog input[type=url],dialog textarea {
  width:100%; padding:12px; border:1px solid #43586b; border-radius:7px; background:#080f18;
}
dialog input:focus,dialog textarea:focus { border-color:var(--accent); outline:2px solid rgba(80,245,220,.2); }
.check { display:flex; align-items:center; gap:9px; margin-top:15px; color:var(--ink); font-size:14px; }
.check input { accent-color:var(--accent); width:17px; height:17px; }
.foot { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
@media (max-width:600px) {
  main { padding:25px 14px 44px; }
  .bar { flex-wrap:wrap; }
  .bar input { flex-basis:100%; }
  .bar .btn { flex:1; }
  .item { gap:9px; padding:14px 11px; }
  .title { font-size:16px; }
  .acts { flex-direction:row; gap:5px; }
  .acts button { padding:6px 8px; }
}
@media (max-width:390px) {
  .item { flex-wrap:wrap; }
  .body { flex-basis:calc(100% - 42px); }
  .acts { margin-left:36px; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto; transition:none !important; } }
</style>
</head>
<body>
<main>
  <h1>LINK CORE</h1>

  <div class="bar">
    <input id="search" type="search" placeholder="タイトル・URL・メモを検索" aria-label="検索">
    <button id="addBtn" class="btn primary" type="button">リンクを追加</button>
  </div>
  <div id="cats" class="cats" role="group" aria-label="カテゴリで絞り込む"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="list" class="list"></div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">リンクを追加</h2>
    <input type="hidden" id="fId">
    <label for="fTitle">タイトル</label>
    <input id="fTitle" type="text" maxlength="200" required>
    <label for="fUrl">URL</label>
    <input id="fUrl" type="text" inputmode="url" placeholder="https://example.com" required>
    <label for="fCat">カテゴリ</label>
    <input id="fCat" type="text" maxlength="50" list="catList">
    <datalist id="catList"></datalist>
    <label for="fMemo">メモ</label>
    <textarea id="fMemo" rows="3"></textarea>
    <label class="check"><input id="fFav" type="checkbox"> お気に入りにする</label>
    <div class="foot">
      <button id="cancelBtn" class="btn" type="button">キャンセル</button>
      <button id="saveBtn" class="btn primary" type="submit">保存する</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const state = { links: [], categories: [], category: '', query: '', busy: false };

  // GAS Webアプリ（?mode=bridge）を隠しiframeで読み込み、postMessageで通信する。
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxjt4DTo0EmNqWZ5Mt5MgqlioxcLXmDhaBwaXwn91YC9XFkX8-HvKC2Nxfe7rQk98JMpA/exec';
  const pending = new Map();
  let bridgeWindow = null;
  let bridgeOrigin = '';
  let markReady;
  const ready = new Promise(resolve => { markReady = resolve; });

  function isGasOrigin(origin) {
    return origin === 'https://script.google.com' ||
      /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(origin);
  }

  window.addEventListener('message', event => {
    if (!isGasOrigin(event.origin)) return;
    const data = event.data;
    if (!data || typeof data !== 'object') return;

    if (data.type === 'DAILY_CORE_BRIDGE_READY') {
      bridgeWindow = event.source;
      bridgeOrigin = event.origin;
      markReady();
      return;
    }

    if (data.type === 'DAILY_CORE_RESPONSE' && event.source === bridgeWindow) {
      const entry = pending.get(data.id);
      if (!entry) return;
      pending.delete(data.id);
      clearTimeout(entry.timer);
      data.ok ? entry.resolve(data.result) : entry.reject(new Error(data.error || '通信に失敗しました。'));
    }
  });

  const frame = document.createElement('iframe');
  frame.src = GAS_URL + '?mode=bridge';
  frame.title = 'LINK CORE bridge';
  frame.hidden = true;
  document.body.appendChild(frame);

  function serverCall(method, ...args) {
    const wait = new Promise((_, reject) => setTimeout(
      () => reject(new Error('GASに接続できません。デプロイの「アクセスできるユーザー」が「全員」か確認してください。')),
      20000));

    return Promise.race([ready, wait]).then(() => new Promise((resolve, reject) => {
      const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random());
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error('GASからの応答がありません。'));
      }, 30000);
      pending.set(id, { resolve, reject, timer });
      bridgeWindow.postMessage({ type: 'DAILY_CORE_REQUEST', id, method, args }, bridgeOrigin);
    }));
  }

  function esc(text) {
    return String(text).replace(/[&<>"']/g, ch => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]
    ));
  }

  // 保存済みでも、表示時に http / https 以外は無効化する。
  function safeHref(url) {
    return /^https?:\/\//i.test(url) ? url : '#';
  }

  function host(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (_) { return url; }
  }

  function setStatus(text, kind) {
    const el = $('status');
    el.textContent = text || '';
    el.className = kind || '';
  }

  function setBusy(value) {
    state.busy = value;
    $('addBtn').disabled = value;
    $('saveBtn').disabled = value;
  }

  function apply(data) {
    state.links = data.links;
    state.categories = data.categories;
    if (state.category && state.categories.indexOf(state.category) === -1) state.category = '';
    render();
  }

  function visibleLinks() {
    const q = state.query.trim().toLowerCase();

    return state.links
      .filter(link => !state.category || link.category === state.category)
      .filter(link => !q || [link.title, link.url, link.memo, link.category]
        .some(text => text.toLowerCase().includes(q)))
      .sort((a, b) =>
        (b.favorite - a.favorite) || b.createdAt.localeCompare(a.createdAt));
  }

  function render() {
    const cats = ['', ...state.categories].map(cat =>
      `<button type="button" class="chip" data-cat="${esc(cat)}" aria-pressed="${cat === state.category}">${cat ? esc(cat) : 'すべて'}</button>`
    ).join('');
    $('cats').innerHTML = cats;

    $('catList').innerHTML = state.categories.map(c => `<option value="${esc(c)}">`).join('');

    const links = visibleLinks();

    if (!links.length) {
      $('list').innerHTML = `<div class="empty">${
        state.links.length ? '条件に合うリンクがありません。' : 'まだリンクがありません。「リンクを追加」から登録してください。'
      }</div>`;
      return;
    }

    $('list').innerHTML = links.map(link => `
      <div class="item" data-id="${esc(link.id)}">
        <button type="button" class="star" aria-pressed="${link.favorite}" aria-label="お気に入り">★</button>
        <div class="body">
          <a class="title" href="${esc(safeHref(link.url))}" target="_blank" rel="noopener noreferrer">${esc(link.title)}</a>
          <div class="meta">${esc(host(link.url))}${link.category ? `<span class="tag">${esc(link.category)}</span>` : ''}</div>
          ${link.memo ? `<div class="memo">${esc(link.memo)}</div>` : ''}
        </div>
        <div class="acts">
          <button type="button" class="edit">編集</button>
          <button type="button" class="del">削除</button>
        </div>
      </div>`).join('');
  }

  async function run(label, task, doneText) {
    if (state.busy) return;
    setBusy(true);
    setStatus(label);
    try {
      apply(await task());
      setStatus(doneText, '');
    } catch (error) {
      setStatus(label.replace('…', '') + 'に失敗しました：' + error.message, 'error');
    } finally {
      setBusy(false);
    }
  }

  function openForm(link) {
    $('form').reset();
    $('fId').value = link ? link.id : '';
    $('fTitle').value = link ? link.title : '';
    $('fUrl').value = link ? link.url : '';
    $('fCat').value = link ? link.category : state.category;
    $('fMemo').value = link ? link.memo : '';
    $('fFav').checked = link ? link.favorite : false;
    $('dlgTitle').textContent = link ? 'リンクを編集' : 'リンクを追加';
    $('saveBtn').textContent = link ? '変更を保存' : '保存する';
    $('dlg').showModal();
    $('fTitle').focus();
  }

  $('addBtn').addEventListener('click', () => openForm(null));
  $('cancelBtn').addEventListener('click', () => $('dlg').close());

  $('form').addEventListener('submit', event => {
    event.preventDefault();
    const input = {
      id: $('fId').value,
      title: $('fTitle').value,
      url: $('fUrl').value,
      category: $('fCat').value,
      memo: $('fMemo').value,
      favorite: $('fFav').checked
    };
    $('dlg').close();
    run('保存中…', () => serverCall('saveLink', input), '保存しました。');
  });

  $('search').addEventListener('input', event => {
    state.query = event.target.value;
    render();
  });

  $('cats').addEventListener('click', event => {
    const chip = event.target.closest('.chip');
    if (!chip) return;
    state.category = chip.dataset.cat;
    render();
  });

  $('list').addEventListener('click', event => {
    const item = event.target.closest('.item');
    if (!item) return;
    const link = state.links.find(l => l.id === item.dataset.id);
    if (!link) return;

    if (event.target.closest('.star')) {
      run('更新中…', () => serverCall('toggleFavorite', link.id, !link.favorite), '');
    } else if (event.target.closest('.edit')) {
      openForm(link);
    } else if (event.target.closest('.del')) {
      if (confirm(`「${link.title}」を削除しますか？`)) {
        run('削除中…', () => serverCall('deleteLink', link.id), '削除しました。');
      }
    }
  });

  run('読み込み中…', () => serverCall('getLinks'), '');
})();
</script>
</body>
</html>
