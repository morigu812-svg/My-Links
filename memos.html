<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サイト運営の一時中断のお知らせ | My Links</title>
  <style>
    html { color-scheme: light; background: #fff; color: #222; }
    body { font-family: system-ui, sans-serif; margin: 0; }
    main { max-width: 40rem; margin: 12vh auto 0; padding: 0 1.5rem; line-height: 1.8; }
    h1 { font-size: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>サイト運営の一時中断のお知らせ</h1>
    <p>セキュリティに関する重大な問題が検出されたため、サイトの運営を一時中断しています。再開時期は未定です。</p>
  </main>
  <iframe id="visit-log" title="アクセス記録" hidden referrerpolicy="no-referrer"></iframe>
  <script>
    const visitUrl = new URL("https://script.google.com/macros/s/AKfycbwvKnZLSpTlZC6AuIx5MPkZmZS7j_9rTQr_y5_YciXvWG65NA-swjI06SZMuVJQgF1z/exec");
    visitUrl.searchParams.set('visit', String(Date.now()) + '-' + Math.random().toString(36).slice(2));
    document.getElementById('visit-log').src = visitUrl.href;
  </script>
</body>
</html>
