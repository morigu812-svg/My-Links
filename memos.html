<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINK CORE / MEMOS</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08090c;color:#eceef3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#171c27 0,#08090c 60%);padding:22px}
.wrap{max-width:1000px;margin:5vh auto 0}.brand{font-size:12px;letter-spacing:.22em;color:#aab5c8}.panel{margin-top:20px;background:rgba(19,22,29,.9);border:1px solid #2a303d;border-radius:22px;padding:clamp(20px,4vw,32px);box-shadow:0 24px 80px #0006}
h1{font-size:clamp(27px,5vw,40px);letter-spacing:-.04em;margin:8px 0 10px}p{color:#aeb5c2;line-height:1.7}
label{display:block;margin:16px 0 7px;font-size:13px;color:#c7ceda}input,textarea{width:100%;padding:13px 14px;background:#090b10;border:1px solid #353d4c;border-radius:12px;color:#fff;font:inherit;outline:none}textarea{min-height:180px;resize:vertical;line-height:1.6}input:focus,textarea:focus{border-color:#93a8ce}
button{border:1px solid #3a4352;border-radius:11px;padding:11px 15px;background:#e8edf7;color:#10141b;font:600 13px inherit;cursor:pointer}button.secondary{background:#151a23;color:#dbe3f1}button.danger{background:#291719;border-color:#5a3036;color:#ffc5ca}button:disabled{opacity:.5;cursor:wait}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.error{color:#ff9999;min-height:1.5em;font-size:13px}.status{font-size:13px;color:#aeb5c2;min-height:1.5em}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:20px 0}.toolbar input{max-width:350px}.list{display:grid;gap:10px}.memo{padding:17px;border:1px solid #2a303d;border-radius:15px;background:#11141b}.memo h3{margin:0 0 8px;font-size:17px;overflow-wrap:anywhere}.memo-body{white-space:pre-wrap;overflow-wrap:anywhere;color:#b9c1ce;line-height:1.65;font-size:14px}.meta{font-size:11px;color:#78859a;margin-top:12px}.empty{border:1px dashed #343b49;padding:28px;border-radius:14px;color:#9ba5b6;text-align:center}a{color:#aebbd0;text-decoration:none}a:hover{color:#fff}

/* === CYBERPUNK THEME OVERRIDES === */
:root{color-scheme:dark;background:#050812;color:#e8faff}
html{background:#050812}
body{background:radial-gradient(ellipse at 10% 0%,rgba(0,238,255,.14),transparent 34%),radial-gradient(ellipse at 92% 12%,rgba(177,54,255,.16),transparent 32%),linear-gradient(145deg,#050812,#091326 60%,#080817);color:#e8faff}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.24;background-image:linear-gradient(rgba(0,238,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(0,238,255,.09) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
.brand{color:#62e9ff;text-shadow:0 0 16px #00d9ff44;letter-spacing:.28em}
.panel{background:linear-gradient(135deg,rgba(8,24,42,.96),rgba(15,16,42,.92));border-color:#1b5067;border-radius:18px;box-shadow:0 0 0 1px #00d9ff0a,0 0 32px #00d9ff16,0 24px 80px #0008}
h1{color:#e8faff;text-shadow:0 0 22px #00d9ff24;letter-spacing:.01em}
p,label{color:#a4c7d9}
input,textarea{background:#050d1b;border-color:#21485d;color:#e8faff}
input::placeholder,textarea::placeholder{color:#68879b}
input:focus,textarea:focus{border-color:#00f0ff;box-shadow:0 0 0 3px #00d9ff20}
button{border-color:#16708b;background:linear-gradient(135deg,#10334b,#171c3b);color:#dffcff;transition:transform .18s,box-shadow .18s,border-color .18s}
button:hover{border-color:#00f0ff;box-shadow:0 0 18px #00d9ff30;transform:translateY(-1px)}
button.secondary{background:#0b1728;color:#bfefff;border-color:#23556b}
button.danger{background:#291024;border-color:#74304e;color:#ffc5d8}
.memo{background:linear-gradient(135deg,rgba(8,25,43,.95),rgba(15,17,40,.92));border-color:#1b5067;box-shadow:inset 3px 0 #00d9ff}
.memo h3{color:#e8faff}
.memo-body{color:#b5d4e5}
.meta,.status{color:#6e96ab}
.empty{border-color:#23556b;color:#91b6ca;background:#07101e}
.error{color:#ff83a7}
a{color:#68eaff}a:hover{color:#fff;text-shadow:0 0 10px #00d9ff55}
::selection{background:#00d9ff55;color:#fff}
@media(max-width:600px){body{padding:12px}.wrap{margin:2vh auto 0}.panel{padding:20px 16px}}


/* Refined low-glare graphite and muted jade palette */
:root{color-scheme:dark;background:#050708;color:#e5eeeb}html,body{background:#050708!important;color:#e5eeeb}body{background:#050708!important}body::before{opacity:.025;background-image:linear-gradient(rgba(110,170,157,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(110,170,157,.035) 1px,transparent 1px);background-size:44px 44px}.brand{color:#79cdb7;text-shadow:none;letter-spacing:.24em}.panel{background:#0b1213;border-color:#263637;border-radius:14px;box-shadow:none}h1{color:#e5eeeb;text-shadow:none}p,label{color:#b1bfba}input,textarea{background:#070c0d;border-color:#304343;color:#e5eeeb}input::placeholder,textarea::placeholder{color:#788985}input:focus,textarea:focus{border-color:#56cbb0;box-shadow:0 0 0 2px #56cbb010}button{background:#14251f;border-color:#36594e;color:#e1f0e9;transition:background-color .12s,border-color .12s}button:hover{border-color:#56cbb0;box-shadow:none;transform:none}button.secondary{background:#11191a;color:#c8d4cf;border-color:#304343}button.danger{background:#241617;border-color:#563438;color:#f0c4c7}.memo{background:#0b1213;border-color:#263637;box-shadow:none}.memo h3{color:#e5eeeb}.memo-body{color:#b1bfba}.meta,.status{color:#879792}.empty{border-color:#344747;color:#9baaa6;background:#0a1112}a{color:#8bcbd1}a:hover{color:#a5e0d3;text-shadow:none}::selection{background:#315b50;color:#fff}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Memo loading shimmer */
@keyframes memoShimmer{0%{background-position:180% 0}100%{background-position:-80% 0}}
.skeleton-card{padding:17px;border:1px solid #263637;border-radius:15px;background:#0b1213}
.skeleton-line{height:12px;border-radius:7px;margin:0 0 12px;background:linear-gradient(100deg,#111a1a 20%,#263633 38%,#111a1a 56%);background-size:220% 100%;animation:memoShimmer 1.35s ease-in-out infinite}
.skeleton-line.title{height:18px;width:46%;margin-bottom:17px}
.skeleton-line.long{width:94%}.skeleton-line.medium{width:72%}.skeleton-line.short{width:35%;margin-bottom:0}
@media(prefers-reduced-motion:reduce){.skeleton-line{animation:none;background:#172321}}

</style>
</head>
<body><main class="wrap">
<div class="brand">LINK CORE / PRIVATE MEMOS</div>
<section class="panel" id="loginPanel">
<h1>メモ帳</h1><p>管理者ログイン後、独立したメモを追加・編集・削除できます。</p>
<form id="loginForm"><label for="password">管理者パスワード</label><input id="password" type="password" autocomplete="current-password" required autofocus><div class="actions"><button id="loginButton" type="submit">ログイン</button><button class="secondary" type="button" onclick="location.href='./'">リンク一覧へ戻る</button></div><div class="error" id="loginError" role="alert"></div></form>
</section>
<section class="panel hidden" id="appPanel">
<div class="brand">MEMO WORKSPACE</div><h1>メモ帳</h1><p>メモはリンク一覧とは別の「Memos」シートに保存されます。</p>
<div class="toolbar"><input id="search" type="search" placeholder="メモを検索" aria-label="メモを検索"><button id="newButton" type="button">＋ 新しいメモ</button></div>
<div class="list" id="memoList" aria-live="polite" aria-busy="true"><div class="skeleton-card" aria-hidden="true"><div class="skeleton-line title"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div><div class="skeleton-card" aria-hidden="true"><div class="skeleton-line title"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div><div class="skeleton-card" aria-hidden="true"><div class="skeleton-line title"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
<div class="panel hidden" id="editor" style="margin-top:18px">
<h2 id="editorHeading">新しいメモ</h2><form id="memoForm"><input id="memoId" type="hidden"><label for="memoTitle">タイトル</label><input id="memoTitle" maxlength="200" required placeholder="メモのタイトル"><label for="memoBody">本文</label><textarea id="memoBody" maxlength="20000" required placeholder="自由にメモを書いてください"></textarea><div class="actions"><button id="saveButton" type="submit">保存</button><button class="secondary" id="cancelButton" type="button">キャンセル</button></div><div class="status" id="saveStatus" role="status"></div></form>
</div><div class="actions"><button class="secondary" id="logoutButton" type="button">ログアウト</button><button class="secondary" type="button" onclick="location.href='./'">リンク一覧へ戻る</button></div>
</section><footer style="margin:22px 0;text-align:center;font-size:12px"><a href="./">← LINK CORE</a></footer>
</main><iframe id="gasBridge" title="通信" hidden></iframe>
<script>
(() => {
'use strict';
const GAS_URL='https://script.google.com/macros/s/AKfycbwr6gUhjgC_zcazwXqDKOqHqiWt1t-NOjrz3IiOjP-NVaXvAJpKOKQ8Ez6It1qKvkxzFw/exec';
const pending=new Map();let bridgeWindow=null,bridgeOrigin='',adminToken='',memos=[]; let requestSeq=0;
let readyResolve;const bridgeReady=new Promise(resolve=>readyResolve=resolve);const frame=document.getElementById('gasBridge');
const embedded=new URLSearchParams(location.search).get('embedded')==='1';
function isGasOrigin(origin){if(origin==='https://script.google.com'||origin==='https://script.googleusercontent.com')return true;try{const h=new URL(origin).hostname;return origin.startsWith('https://')&&(h==='googleusercontent.com'||h.endsWith('.googleusercontent.com'))}catch(_){return false}}
window.addEventListener('message',event=>{if(!isGasOrigin(event.origin))return;const d=event.data;if(!d||typeof d!=='object')return;if(d.type==='DAILY_CORE_BRIDGE_READY'){bridgeWindow=event.source;bridgeOrigin=event.origin;readyResolve();return}if(d.type==='DAILY_CORE_RESPONSE'&&pending.has(d.id)){const p=pending.get(d.id);pending.delete(d.id);d.ok?p.resolve(d.result):p.reject(new Error(d.error||'通信エラー'))}});
frame.src=GAS_URL+'?mode=bridge';
function call(method,...args){if(embedded){return new Promise((resolve,reject)=>{const id='memo-'+Date.now()+'-'+(++requestSeq);const timer=setTimeout(()=>{pending.delete(id);reject(new Error('管理者ページとの通信がタイムアウトしました。メモ帳を閉じて開き直してください。'))},15000);pending.set(id,{resolve:v=>{clearTimeout(timer);resolve(v)},reject:e=>{clearTimeout(timer);reject(e)}});window.parent.postMessage({type:'LINK_CORE_MEMO_REQUEST',id,method,args},location.origin)})}return bridgeReady.then(()=>new Promise((resolve,reject)=>{const id=(crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random());const timer=setTimeout(()=>{pending.delete(id);reject(new Error('サーバーから応答がありません。GASのデプロイを確認してください。'))},15000);pending.set(id,{resolve:v=>{clearTimeout(timer);resolve(v)},reject:e=>{clearTimeout(timer);reject(e)}});bridgeWindow.postMessage({type:'DAILY_CORE_REQUEST',id,method,args},bridgeOrigin)}))}
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ja-JP',{dateStyle:'medium',timeStyle:'short'})}
function showMemoError(message){$('memoList').setAttribute('aria-busy','false');$('memoList').innerHTML='<div class="empty">メモの読み込みに失敗しました：'+esc(message||'通信エラー')+'<div class="actions" style="justify-content:center"><button class="secondary" id="retryMemosButton" type="button">↻ 再試行</button></div></div>';const b=$('retryMemosButton');if(b)b.addEventListener('click',async()=>{b.disabled=true;try{await loadMemos()}catch(err){showMemoError(err.message)}})}
function showMemoSkeleton(){ $('memoList').setAttribute('aria-busy','true'); $('memoList').innerHTML=Array.from({length:3},()=>'<div class="skeleton-card" aria-hidden="true"><div class="skeleton-line title"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>').join('') }
async function loadMemos(){showMemoSkeleton();try{const data=await call('getMemos',adminToken);memos=Array.isArray(data.memos)?data.memos:[];render()}finally{$('memoList').setAttribute('aria-busy','false')}}
if(embedded){
 window.addEventListener('message', event => {
  if(event.origin!==location.origin||event.source!==window.parent)return;
  const data=event.data;
  if(!data||data.type!=='LINK_CORE_MEMO_RESPONSE'||!pending.has(data.id))return;
  const item=pending.get(data.id);pending.delete(data.id);
  data.ok?item.resolve(data.result):item.reject(new Error(data.error||'通信に失敗しました。'));
 });
 $('loginPanel').classList.add('hidden');
 $('appPanel').classList.remove('hidden');
 $('memoList').innerHTML='<div class="empty">管理者認証を確認中…</div>';
 window.addEventListener('message',async event=>{
  if(event.origin!==location.origin||event.source!==window.parent||!event.data||event.data.type!=='LINK_CORE_ADMIN_TOKEN'||typeof event.data.token!=='string'||!event.data.token)return;
  adminToken=event.data.token;
  try{await loadMemos()}catch(err){showMemoError(err.message||'通信エラー')}
 });
} else {
 window.addEventListener('load',()=>{if(window.parent!==window)window.parent.postMessage({type:'MEMO_EMBED_READY'},location.origin)});
}
function render(){$('memoList').setAttribute('aria-busy','false');const q=$('search').value.trim().toLowerCase();const list=memos.filter(m=>(m.title+' '+m.body).toLowerCase().includes(q));$('memoList').innerHTML=list.length?list.map(m=>'<article class="memo"><h3>'+esc(m.title)+'</h3><div class="memo-body">'+esc(m.body)+'</div><div class="meta">更新：'+esc(dateLabel(m.updatedAt))+'</div><div class="actions"><button class="secondary" type="button" data-edit="'+esc(m.id)+'">編集</button><button class="danger" type="button" data-delete="'+esc(m.id)+'">削除</button></div></article>').join(''):'<div class="empty">メモはまだありません。</div>'}
function openEditor(m){$('editor').classList.remove('hidden');$('editorHeading').textContent=m?'メモを編集':'新しいメモ';$('memoId').value=m?m.id:'';$('memoTitle').value=m?m.title:'';$('memoBody').value=m?m.body:'';$('saveStatus').textContent='';$('memoTitle').focus();$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function closeEditor(){$('editor').classList.add('hidden');$('memoForm').reset();$('memoId').value='';$('saveStatus').textContent=''}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault(); $('loginButton').disabled=true; $('loginError').textContent='ログイン中…';
 try {
  const result=await call('authenticateAdmin',$('password').value);
  if(!result || !result.token) throw new Error('認証トークンを取得できませんでした。');
  adminToken=result.token;
  $('loginPanel').classList.add('hidden'); $('appPanel').classList.remove('hidden'); $('loginError').textContent='';
  try{await loadMemos()}catch(loadErr){showMemoError(loadErr.message||'通信エラー');return}
 } catch(err) { $('loginError').textContent=err.message||'ログインできませんでした。'; }
 finally { $('loginButton').disabled=false; }
});
let memoSaveInFlight=false; $('memoForm').addEventListener('submit',async e=>{e.preventDefault();if(memoSaveInFlight)return;memoSaveInFlight=true;$('saveButton').disabled=true;$('saveStatus').textContent='保存中…';try{let id=$('memoId').value;if(!id){id=(crypto.randomUUID&&crypto.randomUUID())||('memo-'+Date.now()+'-'+Math.random().toString(36).slice(2));$('memoId').value=id}const data=await call('saveMemo',{id,title:$('memoTitle').value,body:$('memoBody').value},adminToken);memos=Array.isArray(data.memos)?data.memos:[];render();closeEditor()}catch(err){$('saveStatus').textContent=err.message||'保存に失敗しました。'}finally{memoSaveInFlight=false;$('saveButton').disabled=false}});
$('memoList').addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]');const del=e.target.closest('[data-delete]');if(edit){const memo=memos.find(m=>m.id===edit.dataset.edit);if(memo)openEditor(memo)}if(del){const memo=memos.find(m=>m.id===del.dataset.delete);if(!memo||!confirm('「'+memo.title+'」を削除しますか？'))return;del.disabled=true;try{const data=await call('deleteMemo',memo.id,adminToken);memos=Array.isArray(data.memos)?data.memos:[];render()}catch(err){alert(err.message||'削除に失敗しました。');del.disabled=false}}});
$('newButton').addEventListener('click',()=>openEditor(null));$('cancelButton').addEventListener('click',closeEditor);$('search').addEventListener('input',render);
$('logoutButton').addEventListener('click',()=>{adminToken='';memos=[];$('password').value='';$('appPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');closeEditor()});
})();
</script></body></html>
