<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINK BASE / MEMOS</title>
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="./workspace.css?v=2"><script src="./workspace.js?v=2" defer></script></head>
<body class="memo-page"><main class="wrap">
<div class="brand">LINK BASE / PRIVATE MEMOS</div>
<section class="panel" id="loginPanel">
<h1>メモ帳</h1><p>管理者ログイン後、独立したメモを追加・編集・削除できます。</p>
<form id="loginForm"><label for="password">管理者パスワード</label><input id="password" type="password" autocomplete="current-password" required autofocus><div class="actions"><label for="memoPassword">メモ帳パスワード</label><input id="memoPassword" type="password" autocomplete="current-password" required><button id="loginButton" type="submit">ログイン</button><button class="secondary" type="button" onclick="location.href='./'">リンク一覧へ戻る</button></div><div class="error" id="loginError" role="alert"></div></form>
</section>
<section class="panel hidden" id="appPanel">
<div class="brand">MEMO WORKSPACE</div><h1>メモ帳</h1><p>メモはリンク一覧とは別の「Memos」シートに保存されます。</p>
<div class="toolbar"><input id="search" type="search" placeholder="メモを検索" aria-label="メモを検索"><button id="newButton" type="button">＋ 新しいメモ</button></div>
<div class="list" id="memoList" aria-live="polite" aria-busy="true"><div class="skeleton-card" aria-hidden="true"><div class="skeleton-line title"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div><div class="skeleton-card" aria-hidden="true"><div class="skeleton-line title"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div><div class="skeleton-card" aria-hidden="true"><div class="skeleton-line title"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
<div class="panel hidden" id="editor" >
<h2 id="editorHeading">新しいメモ</h2><form id="memoForm"><input id="memoId" type="hidden"><label for="memoTitle">タイトル</label><input id="memoTitle" maxlength="200" required placeholder="メモのタイトル"><label for="memoBody">本文</label><textarea id="memoBody" maxlength="20000" required placeholder="自由にメモを書いてください"></textarea><div class="actions"><button id="saveButton" type="submit">保存</button><button class="secondary" id="cancelButton" type="button">キャンセル</button></div><div class="status" id="saveStatus" role="status"></div></form>
</div><div class="actions"><button class="secondary" id="logoutButton" type="button">ログアウト</button><button class="secondary" type="button" onclick="location.href='./'">リンク一覧へ戻る</button></div>
</section><footer ><a href="./">← LINK BASE</a></footer>
</main><iframe id="gasBridge" title="通信" hidden></iframe>
<script>
(() => {
'use strict';
const GAS_URL='https://script.google.com/macros/s/AKfycbwr6gUhjgC_zcazwXqDKOqHqiWt1t-NOjrz3IiOjP-NVaXvAJpKOKQ8Ez6It1qKvkxzFw/exec';
const pending=new Map();let bridgeWindow=null,bridgeOrigin='',adminToken='',memoToken='',memos=[]; let requestSeq=0;
let readyResolve;const bridgeReady=new Promise(resolve=>readyResolve=resolve);const frame=document.getElementById('gasBridge');
const embedded=new URLSearchParams(location.search).get('embedded')==='1';
function isGasOrigin(origin){if(origin==='https://script.google.com'||origin==='https://script.googleusercontent.com')return true;try{const h=new URL(origin).hostname;return origin.startsWith('https://')&&(h==='googleusercontent.com'||h.endsWith('.googleusercontent.com'))}catch(_){return false}}
function isBridgeFrame(source) {
  // GAS の中継 iframe をたどり、設定したブリッジの配下か確認する。
  while (source && source !== window) {
    if (source === frame.contentWindow) return true;
    const parent = source.parent;
    if (parent === source) break;
    source = parent;
  }
  return false;
}
window.addEventListener('message',event=>{
 if(!isGasOrigin(event.origin))return;
 const d=event.data;if(!d||typeof d!=='object')return;
 if(d.type==='DAILY_CORE_BRIDGE_READY'){
  if(embedded || bridgeWindow || !isBridgeFrame(event.source))return;
  bridgeWindow=event.source;bridgeOrigin=event.origin;readyResolve();return;
 }
 if(d.type==='DAILY_CORE_RESPONSE'){
  if(embedded||event.source!==bridgeWindow||event.origin!==bridgeOrigin||!pending.has(d.id))return;
  const p=pending.get(d.id);pending.delete(d.id);d.ok?p.resolve(d.result):p.reject(new Error(d.error||'通信エラー'));
 }
});
if(!embedded)frame.src=GAS_URL+'?mode=bridge';
const GAS_TIMEOUT_MS = 30000;
function waitForBridge() {
  if (bridgeWindow && bridgeOrigin) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('GASとの接続に時間がかかっています。時間をおいて再試行してください。')), GAS_TIMEOUT_MS);
    bridgeReady.then(() => { clearTimeout(timer); resolve(); });
  });
}
function call(method,...args){if(embedded){return new Promise((resolve,reject)=>{const id='memo-'+Date.now()+'-'+(++requestSeq);const timer=setTimeout(()=>{pending.delete(id);reject(new Error('管理者ページとの通信がタイムアウトしました。メモ帳を閉じて開き直してください。'))},GAS_TIMEOUT_MS);pending.set(id,{resolve:v=>{clearTimeout(timer);resolve(v)},reject:e=>{clearTimeout(timer);reject(e)}});window.parent.postMessage({type:'LINK_CORE_MEMO_REQUEST',id,method,args},location.origin)})}return callBridge(method, ...args);
}
function callBridge(method, ...args) {
  return waitForBridge().then(() => new Promise((resolve, reject) => {
    const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random());
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(new Error('サーバーから応答がありません。時間をおいて再試行してください。'));
    }, GAS_TIMEOUT_MS);

    pending.set(id, {
      resolve: value => { clearTimeout(timer); resolve(value); },
      reject: error => { clearTimeout(timer); reject(error); }
    });
    try {
      bridgeWindow.postMessage({ type: 'DAILY_CORE_REQUEST', id, method, args }, bridgeOrigin);
    } catch (error) {
      pending.delete(id);
      clearTimeout(timer);
      reject(error);
    }
  }));
}
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ja-JP',{dateStyle:'medium',timeStyle:'short'})}
function showMemoError(message){$('memoList').setAttribute('aria-busy','false');$('memoList').innerHTML='<div class="empty">メモの読み込みに失敗しました：'+esc(message||'通信エラー')+'<div class="actions" ><button class="secondary" id="retryMemosButton" type="button"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M20 7v5h-5"/><path d="M20 12a8 8 0 1 1-2.3-5.7L20 9"/></svg>再試行</button></div></div>';const b=$('retryMemosButton');if(b)b.addEventListener('click',async()=>{b.disabled=true;try{await loadMemos()}catch(err){showMemoError(err.message)}})}
function showMemoSkeleton(){ $('memoList').setAttribute('aria-busy','true'); $('memoList').innerHTML=Array.from({length:3},()=>'<div class="skeleton-card" aria-hidden="true"><div class="skeleton-line title"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>').join('') }
async function loadMemos(){showMemoSkeleton();try{const data=await call('getMemos',memoToken,adminToken);memos=Array.isArray(data.memos)?data.memos:[];render()}finally{$('memoList').setAttribute('aria-busy','false')}}
if(embedded){
 window.addEventListener('message', event => {
  if(event.origin!==location.origin||event.source!==window.parent)return;
  const data=event.data;
  if(!data||data.type!=='LINK_CORE_MEMO_RESPONSE'||!pending.has(data.id))return;
  const item=pending.get(data.id);pending.delete(data.id);
  data.ok?item.resolve(data.result):item.reject(new Error(data.error||'通信に失敗しました。'));
 });
 $('password').closest('label')?.classList.add('hidden');
 $('password').hidden = true;
 $('password').required = false;
 document.querySelector('label[for="password"]')?.classList.add('hidden');
 $('loginButton').disabled = true;
 window.addEventListener('message',async event=>{
  if(event.origin!==location.origin||event.source!==window.parent||!event.data||event.data.type!=='LINK_CORE_ADMIN_TOKEN'||typeof event.data.token!=='string'||!event.data.token)return;
  adminToken=event.data.token;
  $('loginButton').disabled = false;
 });
} else {
 window.addEventListener('load',()=>{if(window.parent!==window)window.parent.postMessage({type:'MEMO_EMBED_READY'},location.origin)});
}
function render(){$('memoList').setAttribute('aria-busy','false');const q=$('search').value.trim().toLowerCase();const list=memos.filter(m=>(m.title+' '+m.body).toLowerCase().includes(q));$('memoList').innerHTML=list.length?list.map(m=>'<article class="memo"><h3>'+esc(m.title)+'</h3><div class="memo-body">'+esc(m.body)+'</div><div class="meta">更新：'+esc(dateLabel(m.updatedAt))+'</div><div class="actions"><button class="secondary" type="button" data-edit="'+esc(m.id)+'">編集</button><button class="danger" type="button" data-delete="'+esc(m.id)+'">削除</button></div></article>').join(''):'<div class="empty">メモはまだありません。</div>'}
function openEditor(m){$('editor').classList.remove('hidden');$('editorHeading').textContent=m?'メモを編集':'新しいメモ';$('memoId').value=m?m.id:'';$('memoTitle').value=m?m.title:'';$('memoBody').value=m?m.body:'';$('saveStatus').textContent='';$('memoTitle').focus();$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function closeEditor(){$('editor').classList.add('hidden');$('memoForm').reset();$('memoId').value='';$('saveStatus').textContent=''}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault(); $('loginButton').disabled=true; $('loginError').textContent='ログイン中…';
 try {
  if (!embedded) {
   const loginStartedAt = Date.now();
   const result = await call('authenticateAdmin', $('password').value);
   if (!result?.token) throw new Error('管理者認証を確認できませんでした。');
   adminToken = result.token;
   stopMemoExpiry();
   stopMemoExpiry = watchSessionExpiry(loginStartedAt + Math.min(result.expiresIn || 1800, 1800) * 1000, () => location.reload());
  }
  const memoAuth = await call('authenticateMemo', $('memoPassword').value, adminToken);
  if (!memoAuth?.token) throw new Error('メモ帳の認証を確認できませんでした。');
  memoToken = memoAuth.token;
  $('memoPassword').value = '';
  $('password').value = '';
  $('loginPanel').classList.add('hidden'); $('appPanel').classList.remove('hidden'); $('loginError').textContent='';
  try{await loadMemos()}catch(loadErr){showMemoError(loadErr.message||'通信エラー');return}
 } catch(err) { $('loginError').textContent=err.message||'ログインできませんでした。'; }
 finally { $('loginButton').disabled=false; }
});
let memoSaveInFlight=false; $('memoForm').addEventListener('submit',async e=>{e.preventDefault();if(memoSaveInFlight)return;memoSaveInFlight=true;$('saveButton').disabled=true;$('saveStatus').textContent='保存中…';try{let id=$('memoId').value;if(!id){id=(crypto.randomUUID&&crypto.randomUUID())||('memo-'+Date.now()+'-'+Math.random().toString(36).slice(2));$('memoId').value=id}const data=await call('saveMemo',{id,title:$('memoTitle').value,body:$('memoBody').value},memoToken,adminToken);memos=Array.isArray(data.memos)?data.memos:[];render();closeEditor()}catch(err){$('saveStatus').textContent=err.message||'保存に失敗しました。'}finally{memoSaveInFlight=false;$('saveButton').disabled=false}});
$('memoList').addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]');const del=e.target.closest('[data-delete]');if(edit){const memo=memos.find(m=>m.id===edit.dataset.edit);if(memo)openEditor(memo)}if(del){const memo=memos.find(m=>m.id===del.dataset.delete);if(!memo||!confirm('「'+memo.title+'」を削除しますか？'))return;del.disabled=true;try{const data=await call('deleteMemo',memo.id,memoToken,adminToken);memos=Array.isArray(data.memos)?data.memos:[];render()}catch(err){alert(err.message||'削除に失敗しました。');del.disabled=false}}});
$('newButton').addEventListener('click',()=>openEditor(null));$('cancelButton').addEventListener('click',closeEditor);$('search').addEventListener('input',render);
function watchSessionExpiry(deadline, onExpired) {
  function checkExpiry() {
    if (Date.now() < deadline) return;
    stopWatching();
    onExpired();
  }
  function stopWatching() {
    clearTimeout(timer);
    document.removeEventListener('visibilitychange', checkExpiry);
    window.removeEventListener('pageshow', checkExpiry);
  }
  const timer = setTimeout(checkExpiry, Math.max(0, deadline - Date.now()));
  document.addEventListener('visibilitychange', checkExpiry);
  window.addEventListener('pageshow', checkExpiry);
  return stopWatching;
}

let stopMemoExpiry = () => {};
$('logoutButton').addEventListener('click', async event => {
  event.currentTarget.disabled = true;
  stopMemoExpiry();
  const token = adminToken;
  adminToken = '';
  $('appPanel').classList.add('hidden');
  closeEditor();
  try { if (token && !embedded) await call('logoutCurrentSession', token); }
  catch (_) {}
  finally {
    if (embedded) window.parent.postMessage({type:'LINK_CORE_MEMO_CLOSE'},location.origin);
    else location.reload();
  }
});
})();
</script></body></html>
